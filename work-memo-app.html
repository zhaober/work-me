<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>工作计划与复盘备忘录</title>
<!-- 字体说明：本应用为纯离线应用，不使用任何远程字体。
     远程样式表是渲染阻塞资源，在无法访问该域名的网络下会让 WebView 长时间白屏，
     表现为「打不开软件」。这里统一使用系统字体栈，零请求、零延迟。 -->
<style>
  :root{
    --bg:#F4F5FA; --card:#FFFFFF; --border:#ECECF1;
    --text:#1A1D29; --text-2:#70747E; --text-3:#A0A4AE;
    --gray:#9AA0AB; --empty:#D8DBE2;
    --accent:#4F6EF7; --accent-soft:#EEF1FE; --accent-stroke:#C9D2FB;
    --orange:#FF8A3D; --orange-soft:#FFF1E6; --orange-card:#FFF8F2; --orange-border:#FBCDA8;
    --green:#2BB673; --green-soft:#E8F8EF;
    --progress-track:#F0E2D6; --check-off:#C9CDD6; --body:#2A2D36;
    --danger:#E53935;
    --app-font-scale:1;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#E9EBF2;display:flex;justify-content:center;}
  .app{width:100%;max-width:480px;height:100%;background-color:var(--bg);background-image:var(--app-bg-image, none);background-size:cover;background-position:center;position:relative;overflow:hidden;border-radius:0;box-shadow:none;display:flex;flex-direction:column;}
  .app.fs-small{--app-font-scale:0.875;}
  .app.fs-normal{--app-font-scale:1;}
  .app.fs-large{--app-font-scale:1.125;}
  .app.fs-huge{--app-font-scale:1.25;}
  .app[data-text-color="white"]{--text:#FFFFFF;--text-2:rgba(255,255,255,0.85);--text-3:rgba(255,255,255,0.65);--body:#FFFFFF;}
  .app[data-text-color="black"]{--text:#000000;--text-2:rgba(0,0,0,0.8);--text-3:rgba(0,0,0,0.55);--body:#000000;}
  .app.has-bg[data-text-color="auto"] .t-greet,
  .app.has-bg[data-text-color="auto"] .t-date,
  .app.has-bg[data-text-color="auto"] .t-section,
  .app.has-bg[data-text-color="auto"] .t-title,
  .app.has-bg[data-text-color="auto"] .t-name,
  .app.has-bg[data-text-color="auto"] .t-rec-title,
  .app.has-bg[data-text-color="auto"] .t-body,
  .app.has-bg[data-text-color="auto"] .head .title,
  .app.has-bg[data-text-color="auto"] .ov-big-plan,
  .app.has-bg[data-text-color="auto"] .ov-big-review,
  .app.has-bg[data-text-color="auto"] .newfolder,
  .app.has-bg[data-text-color="white"] .t-greet,
  .app.has-bg[data-text-color="white"] .t-date,
  .app.has-bg[data-text-color="white"] .t-section,
  .app.has-bg[data-text-color="white"] .t-title,
  .app.has-bg[data-text-color="white"] .t-name,
  .app.has-bg[data-text-color="white"] .t-rec-title,
  .app.has-bg[data-text-color="white"] .t-body,
  .app.has-bg[data-text-color="white"] .head .title,
  .app.has-bg[data-text-color="white"] .ov-big-plan,
  .app.has-bg[data-text-color="white"] .ov-big-review,
  .app.has-bg[data-text-color="white"] .newfolder,
  .app.has-bg[data-text-color="black"] .t-greet,
  .app.has-bg[data-text-color="black"] .t-date,
  .app.has-bg[data-text-color="black"] .t-section,
  .app.has-bg[data-text-color="black"] .t-title,
  .app.has-bg[data-text-color="black"] .t-name,
  .app.has-bg[data-text-color="black"] .t-rec-title,
  .app.has-bg[data-text-color="black"] .t-body,
  .app.has-bg[data-text-color="black"] .head .title,
  .app.has-bg[data-text-color="black"] .ov-big-plan,
  .app.has-bg[data-text-color="black"] .ov-big-review,
  .app.has-bg[data-text-color="black"] .newfolder{text-shadow:var(--text-shadow);}
  .app.has-bg[data-text-color="white"] .t-greet,
  .app.has-bg[data-text-color="white"] .t-date,
  .app.has-bg[data-text-color="white"] .t-section,
  .app.has-bg[data-text-color="white"] .t-title,
  .app.has-bg[data-text-color="white"] .t-name,
  .app.has-bg[data-text-color="white"] .t-rec-title,
  .app.has-bg[data-text-color="white"] .t-body,
  .app.has-bg[data-text-color="white"] .head .title,
  .app.has-bg[data-text-color="white"] .ov-big-plan,
  .app.has-bg[data-text-color="white"] .ov-big-review,
  .app.has-bg[data-text-color="white"] .newfolder{text-shadow:0 1px 4px rgba(0,0,0,0.65);}
  .app.has-bg[data-text-color="black"] .t-greet,
  .app.has-bg[data-text-color="black"] .t-date,
  .app.has-bg[data-text-color="black"] .t-section,
  .app.has-bg[data-text-color="black"] .t-title,
  .app.has-bg[data-text-color="black"] .t-name,
  .app.has-bg[data-text-color="black"] .t-rec-title,
  .app.has-bg[data-text-color="black"] .t-body,
  .app.has-bg[data-text-color="black"] .head .title,
  .app.has-bg[data-text-color="black"] .ov-big-plan,
  .app.has-bg[data-text-color="black"] .ov-big-review,
  .app.has-bg[data-text-color="black"] .newfolder{text-shadow:0 1px 3px rgba(255,255,255,0.75);}
  .screen{position:absolute;top:0;left:0;right:0;bottom:95px;overflow-y:auto;display:none;padding-top:env(safe-area-inset-top);}
  .screen.active{display:block;}
  .screen.editor{bottom:64px;}
  .content{padding:16px 20px;display:flex;flex-direction:column;}
  .content.g18{gap:18px;} .content.g16{gap:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;}
  .card.r14{border-radius:14px;}
  .row-between{display:flex;align-items:center;justify-content:space-between;}
  .row-center{display:flex;align-items:center;}
  .gap8{gap:8px;}.gap10{gap:10px;}.gap12{gap:12px;}
  .t-greet{font-size:calc(20px * var(--app-font-scale));font-weight:700;color:var(--text);}
  .t-date{font-size:calc(13px * var(--app-font-scale));font-weight:500;color:var(--text-2);}
  .t-section{font-size:calc(16px * var(--app-font-scale));font-weight:600;color:var(--text);}
  .t-label{font-size:calc(12px * var(--app-font-scale));font-weight:500;color:var(--text-2);}
  .t-sub{font-size:calc(12px * var(--app-font-scale));font-weight:400;color:var(--text-2);}
  .t-body{font-size:calc(15px * var(--app-font-scale));font-weight:400;color:var(--body);line-height:1.5;}
  .t-title{font-size:calc(22px * var(--app-font-scale));font-weight:700;color:var(--text);}
  .t-meta{font-size:calc(12px * var(--app-font-scale));font-weight:400;color:var(--text-2);}
  .t-name{font-size:calc(14px * var(--app-font-scale));font-weight:600;color:var(--text);}
  .t-rec-title{font-size:calc(14px * var(--app-font-scale));font-weight:500;color:var(--text);}
  .t-path{font-size:calc(13px * var(--app-font-scale));font-weight:400;color:var(--text-2);}
  .chev{color:var(--accent);} .chev-gray{color:var(--text-3);}
  /* search */
  .search{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:8px;}
  .search input{border:none;outline:none;background:transparent;font-size:14px;color:var(--text);font-family:inherit;width:100%;}
  .search input::placeholder{color:var(--text-3);}
  /* today overview */
  .overview{display:flex;flex-direction:column;gap:12px;}
  .ov-card{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--border);}
  .ov-num-row{display:flex;align-items:baseline;gap:6px;}
  .ov-big-plan{font-size:calc(28px * var(--app-font-scale));font-weight:700;color:var(--accent);line-height:1;}
  .ov-big-review{font-size:calc(24px * var(--app-font-scale));font-weight:700;color:var(--orange);line-height:1;}
  /* folder rows */
  .frow{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .ficon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ftext{display:flex;flex-direction:column;gap:2px;}
  .newfolder{border:1px solid var(--accent-stroke);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--accent);font-size:14px;font-weight:500;background:transparent;cursor:pointer;}
  /* header row */
  .head{display:flex;align-items:center;justify-content:space-between;}
  .head .title{font-size:calc(18px * var(--app-font-scale));font-weight:700;color:var(--text);}
  .back,.more,.bell,.del{background:none;border:none;cursor:pointer;display:flex;padding:0;color:var(--text);}
  .icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:10px;}
  .icon-btn:active{background:rgba(0,0,0,.05);}
  .export-btn{border:1px solid var(--border);border-radius:10px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--accent);background:var(--card);cursor:pointer;}
  /* breadcrumb */
  .crumb{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:12px;color:var(--text-2);}
  .crumb .seg{cursor:pointer;} .crumb .seg.cur{color:var(--text);font-weight:600;} .crumb .sep{color:var(--text-3);}
  /* subfolders */
  .subgrid{display:flex;gap:12px;flex-wrap:wrap;}
  .subgrid .scard{flex:1;min-width:120px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;}
  .subgrid .scard.newsub{border-style:dashed;border-color:var(--accent-stroke);}
  /* record rows */
  .rec{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .rec .left{display:flex;align-items:center;gap:10px;min-width:0;}
  .rec .rtext{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .rec .rtext .t-rec-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge{width:40px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex-shrink:0;}
  .badge.plan{background:var(--accent);} .badge.review{background:var(--orange);}
  .link-blue{color:var(--accent);font-size:12px;font-weight:500;cursor:pointer;}
  /* editor */
  .etype{display:flex;align-items:center;gap:8px;}
  .reminder{background:var(--accent-soft);border-radius:14px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px;align-self:flex-start;cursor:pointer;border:none;font-family:inherit;}
  .reminder span{font-size:12px;font-weight:500;color:var(--accent);}
  .checklist{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .citem{display:flex;align-items:center;gap:10px;}
.cdel{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--danger);font-size:18px;font-weight:600;cursor:pointer;margin-left:auto;border-radius:6px;}
.cdel:active{background:rgba(229,57,53,.1);}
  .cb{width:18px;height:18px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .cb.on{background:var(--accent);} .cb.off{background:transparent;border:1.5px solid var(--check-off);}
  .imgblock{width:100%;height:140px;border-radius:12px;background:#E9EBF2;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:12px;cursor:pointer;background-size:cover;background-position:center;overflow:hidden;position:relative;}
  .imgblock.has-img{color:transparent;}
  .divider{height:1px;background:var(--border);width:100%;}
  .tags{display:flex;gap:8px;flex-wrap:wrap;cursor:pointer;}
  .tag{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;}
  .tag.orange{background:var(--orange-soft);color:var(--orange);} .tag.green{background:var(--green-soft);color:var(--green);}
  /* priority */
  .priority-wrap{display:flex;flex-direction:column;gap:8px;}
  .priority-row{display:flex;gap:8px;}
  .priority-seg{flex:1;padding:8px 4px;border-radius:10px;text-align:center;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--text-2);cursor:pointer;}
  .priority-seg.active{color:#fff;border-color:transparent;}
  .priority-flag{padding:2px 7px;border-radius:6px;font-size:10px;font-weight:600;color:#fff;margin-left:6px;white-space:nowrap;}
  .rec.priority-stripe{position:relative;padding-left:11px;}
  .rec.priority-stripe::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--p-color);}
  /* linked / compare */
  .linked{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;}
  .linked .lt{display:flex;flex-direction:column;gap:2px;}
  .compare{background:var(--orange-card);border:1px solid var(--orange-border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .pbar{height:6px;border-radius:3px;background:var(--progress-track);overflow:hidden;}
  .pbar > i{display:block;height:100%;background:var(--orange);border-radius:3px;}
  .cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .cdot.on{background:var(--orange);} .cdot.off{background:var(--check-off);}
  /* calendar */
  .calcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 12px;}
  .calhead{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;}
  .calhead span{text-align:center;font-size:11px;color:var(--gray);}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .calcell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text);border-radius:14px;cursor:pointer;position:relative;}
  .calcell.empty{color:var(--empty);cursor:default;}
  .calcell.has{font-weight:600;}
  .calcell .calmark{position:absolute;bottom:3px;left:0;right:0;display:flex;justify-content:center;gap:2px;}
  .calcell .calmark span{width:4px;height:4px;border-radius:50%;}
  .cm-rec{background:var(--accent);}
  .cm-term{background:var(--green);}
  .cm-festival{background:var(--orange);}
  .cm-custom{background:#7C5CFC;}
  .calcell.today{background:var(--accent);color:#fff;font-weight:600;}
  .calcell.sel{outline:2px solid var(--accent);outline-offset:-2px;}
  .daypanel{display:flex;flex-direction:column;gap:4px;}
  .daymarks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .daymark{font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px;display:inline-flex;align-items:center;}
  .dm-term{background:var(--green-soft);color:var(--green);}
  .dm-festival{background:var(--orange-soft);color:var(--orange);}
  .dm-custom{background:#EFEAFF;color:#5B3DF2;}
  .dm-del{margin-left:5px;cursor:pointer;opacity:.65;font-weight:700;}
  .dm-del:active{opacity:1;}
  /* stats */
  .period{background:var(--accent-soft);border-radius:14px;padding:8px 12px;color:var(--accent);font-size:12px;font-weight:500;cursor:pointer;}
  .metric-row{display:flex;gap:12px;}
  .metric-row .card{flex:1;padding:16px;display:flex;flex-direction:column;gap:4px;}
  .mbig-orange{font-size:24px;font-weight:700;color:var(--orange);}
  .mbig-green{font-size:24px;font-weight:700;color:var(--green);}
  .mbig-blue{font-size:32px;font-weight:700;color:var(--accent);}
  .bars{display:flex;align-items:flex-end;gap:8px;height:96px;padding-top:4px;}
  .bars .bar{flex:1;border-radius:6px;background:var(--accent);min-height:6px;}
  .empty-hint{padding:24px;text-align:center;color:var(--text-3);font-size:13px;}
  /* search results */
  .result-row{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;}
  .result-row .rp{font-size:12px;color:var(--text-3);}
  /* toast */
  .toast{position:absolute;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:13px;padding:10px 16px;border-radius:12px;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;max-width:300px;}
  .toast.show{opacity:.96;}
  /* tab bar */
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(95px + env(safe-area-inset-bottom));background:var(--bg);padding:12px 21px env(safe-area-inset-bottom);display:none;z-index:6;}
  .tabbar.show{display:block;}
  .pill{background:var(--card);border:1px solid var(--border);border-radius:36px;height:62px;display:flex;}
  .tab{flex:1;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;color:var(--gray);border:none;cursor:pointer;font-family:inherit;}
  .tab.active{background:var(--accent);color:#fff;}
  .tab span{font-size:10px;font-weight:600;} .tab svg{display:block;}
  /* editor toolbar */
  .editortoolbar{position:absolute;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--border);display:none;align-items:center;justify-content:center;gap:18px;z-index:6;padding:0 20px env(safe-area-inset-bottom);}
  .editortoolbar.show{display:flex;}
  .etbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--text-2);border-radius:10px;}
  .etbtn:active{background:rgba(0,0,0,.05);}

  /* modal prompt/confirm */
  .modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal-card{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;box-shadow:0 16px 48px rgba(0,0,0,.2);}
  .modal-card .mtitle{font-size:17px;font-weight:700;color:var(--text);}
  .modal-card .mmsg{font-size:14px;color:var(--text-2);line-height:1.5;white-space:pre-line;}
  .modal-card input{border:none;border-bottom:1px solid var(--border);padding:10px 0;font-size:15px;outline:none;color:var(--text);font-family:inherit;background:transparent;width:100%;}
  .modal-card input:focus{border-color:var(--accent);}
  .modal-actions{display:flex;justify-content:flex-end;gap:14px;margin-top:4px;}
  .modal-actions button{background:none;border:none;font-size:15px;font-weight:600;color:var(--text-2);cursor:pointer;padding:6px 8px;}
  .modal-actions .primary{color:var(--accent);}

  /* wheel picker（滚盘） */
  .wheel-overlay{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:60;display:none;align-items:flex-end;}
  .wheel-overlay.show{display:flex;}
  .wheel-card{background:var(--card);border-radius:18px 18px 0 0;width:100%;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px;}
  .wheel-title{font-size:16px;font-weight:700;color:var(--text);text-align:center;}
  .wheel-cols{position:relative;display:flex;gap:6px;height:200px;overflow:hidden;}
  .wheel-band{position:absolute;left:0;right:0;top:80px;height:40px;background:var(--accent-soft);border-radius:10px;pointer-events:none;}
  .wheel-col{flex:1;height:200px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-ms-overflow-style:none;position:relative;}
  .wheel-col::-webkit-scrollbar{display:none;}
  .wheel-item{height:40px;line-height:40px;text-align:center;font-size:16px;color:var(--text-3);scroll-snap-align:center;transition:color .12s,transform .12s;white-space:nowrap;}
  .wheel-item.sel{color:var(--text);font-weight:700;transform:scale(1.06);}
  .wheel-actions{display:flex;justify-content:flex-end;gap:14px;}
  .wheel-actions button{background:none;border:none;font-size:15px;font-weight:600;color:var(--text-2);cursor:pointer;padding:6px 8px;}
  .wheel-actions .primary{color:var(--accent);}
  .wheel-field{display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--border);padding:10px 0;font-size:15px;outline:none;color:var(--text);font-family:inherit;background:transparent;cursor:pointer;}

  /* action sheet */
  .sheet-overlay{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none;}
  .sheet-overlay.show{display:block;}

<script>
/* ============ 启动崩溃兜底（经典脚本，必须早于 module 脚本注册） ============
   module 脚本一旦加载失败（import 解析错误、语法错误、CDN 不可达），
   它自身的代码一行都不会执行；只有先注册的经典脚本能捕获到这类致命错误。
   捕获结果写入 localStorage，并在启动超时后展示错误面板，
   让用户看到「为什么打不开」，而不是只能看到一个闪退的空白。 */
(function(){
  var KEY = 'work-memo-crash-log';
  window.__WM_STAGE__ = 'html-parsed';
  window.__WM_BOOT_OK__ = false;
  function save(kind, msg, stack){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        kind: kind,
        message: String(msg == null ? '' : msg),
        stack: String(stack == null ? '' : stack),
        at: new Date().toISOString(),
        ua: navigator.userAgent
      }));
    }catch(e){ /* 日志写不进去也不能影响启动 */ }
  }
  window.__wmSaveCrash = save;
  window.__wmReadCrash = function(){
    try{ var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  };
  window.__wmClearCrash = function(){ try{ localStorage.removeItem(KEY); }catch(e){} };
  /* 必须用捕获阶段：img/script/link 的资源加载错误不冒泡，只在捕获阶段可见 */
  window.addEventListener('error', function(ev){
    if(ev && ev.target && ev.target !== window && ev.target.tagName){
      save('resource', '加载失败：' + (ev.target.src || ev.target.href || ev.target.tagName), '');
      return;
    }
    save('error', (ev && ev.message) || '未知错误', (ev && ev.error && ev.error.stack) || '');
  }, true);
  window.addEventListener('unhandledrejection', function(ev){
    var r = ev && ev.reason;
    save('promise', (r && r.message) || String(r), (r && r.stack) || '');
  });
  window.__wmShowCrash = function(){
    var panel = document.getElementById('crashPanel');
    if(!panel) return;
    var rec = window.__wmReadCrash();
    var report = window.__wmBuildReport ? window.__wmBuildReport(rec, window.__WM_STAGE__) : null;
    var titleEl = document.getElementById('crashTitle');
    var detailEl = document.getElementById('crashDetail');
    if(titleEl) titleEl.textContent = (report && report.title) || '启动异常';
    if(detailEl) detailEl.textContent = (report && report.detail) || ('阶段：' + window.__WM_STAGE__);
    panel.style.display = 'flex';
  };
  window.__wmHideCrash = function(){
    var panel = document.getElementById('crashPanel');
    if(panel) panel.style.display = 'none';
  };
  /* 看门狗：超时仍未启动成功则展示面板。
     启动成功时 App 会置 __WM_BOOT_OK__ = true 并隐藏面板，所以误报代价很低。 */
  window.addEventListener('DOMContentLoaded', function(){
    setTimeout(function(){
      if(window.__WM_BOOT_OK__) return;
      window.__wmShowCrash();
    }, 10000);
  });
})();
</script>

function childrenOf(id){ var r=[]; for(var k in DB.folders){ if(DB.folders[k].parent===id) r.push(k); } return r; }
function recordsOf(id){ var r=[]; for(var k in DB.records){ if(DB.records[k].folderId===id) r.push(k); } return r; }

function folderMeta(id){ var c=childrenOf(id).length, n=recordsOf(id).length; var s=[]; if(n) s.push(n+' 条'); if(c) s.push(c+' 子文件夹'); return s.join(' · ')||'空'; }

/* ============ PERSISTENCE (IndexedDB 为主，localStorage 降级) ============ */
var DB_VERSION = 1;
var LS_KEY = LEGACY_LS_KEY;
/** 'idb' = IndexedDB（默认）；'ls' = 降级到 localStorage（环境不支持 IndexedDB 时） */
var STORAGE_MODE = 'idb';
var noteDB = new NoteDB();
/** 启动已因超时降级后，忽略存储层迟到的回填，避免覆盖已渲染的数据 */
var storeBootAborted = false;
/** image_id -> objectURL。Blob 不能直接塞进 CSS，需转成 URL 才能渲染 */
var imageUrlCache = {};
/** 图片仓库统计缓存（异步刷新，供「我的」同步读取） */
var imageStatsCache = { count: 0, bytes: 0 };

function idbSupported(){
  try { return (typeof indexedDB !== 'undefined') && indexedDB !== null; } catch(e){ return false; }
}

/** 补齐记录字段：IndexedDB 以 id 为 keyPath，旧数据只有键没有 id 字段 */
function applyDbShape(folders, records, events, settings){
  if(storeBootAborted) return;   // 已超时降级，丢弃存储层迟到的结果
  if(folders) DB.folders = folders;
  if(records) DB.records = records;
  DB.events = events || [];
  DB.settings = normalizeSettings(settings || null);
  Object.keys(DB.records).forEach(function(k){
    var r = DB.records[k];
    r.id = k;
    if(typeof r.priority !== 'number') r.priority = 0;
    if(r.image_id === undefined) r.image_id = null;
    if(r.image === undefined) r.image = null;
  });
}

/** 把 IndexedDB 里的图片 Blob 转成可渲染的 objectURL，回填 record.image */
async function hydrateRecordImage(rec){
  if(!rec || !rec.image_id) return;
  if(imageUrlCache[rec.image_id]){ rec.image = imageUrlCache[rec.image_id]; return; }
  try{
    var row = await noteDB.getImage(rec.image_id);
    var blob = row && (row.blob_full || row.blob_thumb);
    if(!blob) return;
    var url = URL.createObjectURL(blob);
    imageUrlCache[rec.image_id] = url;
    rec.image = url;
  }catch(e){ /* 单张图缺失不影响笔记本身 */ }
}
async function hydrateImages(){
  var jobs = [];
  Object.keys(DB.records).forEach(function(k){ jobs.push(hydrateRecordImage(DB.records[k])); });
  await Promise.all(jobs);
}

/**
 * 释放某张图片的 objectURL。
 * 去重会让多条笔记共用同一张图，仍有引用时不能释放。
 */
function releaseImageUrl(imageId){
  if(!imageId) return;
  var stillUsed = Object.keys(DB.records).some(function(k){
    return DB.records[k].image_id === imageId;
  });
  if(stillUsed) return;
  var url = imageUrlCache[imageId];
  if(url){
    try { URL.revokeObjectURL(url); } catch(e){}
    delete imageUrlCache[imageId];
  }
}

/** 清理已无记录引用的 objectURL（换图 / 删图后的残留，避免内存缓慢增长） */
function releaseUnusedImageUrls(){
  var used = {};
  Object.keys(DB.records).forEach(function(k){
    var id = DB.records[k].image_id; if(id) used[id] = true;
  });
  Object.keys(imageUrlCache).forEach(function(imageId){
    if(!used[imageId]){
      try { URL.revokeObjectURL(imageUrlCache[imageId]); } catch(e){}
      delete imageUrlCache[imageId];
    }
  });
}

async function refreshImageStats(){

/* ---------- 读：IndexedDB ---------- */
async function loadFromIdb(){

  var lightRows = await noteDB.listNotes();   // 列表行不含正文，先拿到全部 id
  var records = {};
  for(var i = 0; i < lightRows.length; i++){
    var full = await noteDB.getNote(lightRows[i].id);  // 逐条按 id 精确取正文
    if(full) records[full.id] = full;
  }
  applyDbShape(meta.folders, records, meta.events, meta.settings);
  await hydrateImages();
  await refreshImageStats();
}

/* ---------- 读：localStorage（降级 / 旧版本数据） ---------- */
function loadFromLocalStorage(){
  var raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch(e){ return false; }
  if(!raw) return false;
  try{
    var parsed = JSON.parse(raw);
    if(!parsed || !parsed.records) return false;
    applyDbShape(parsed.folders, parsed.records, parsed.events, parsed.settings);
    return true;
  }catch(e){ return false; }
}

/** IndexedDB 里是否已有数据（决定是否要迁移旧 localStorage 数据） */
async function idbHasData(){
  try{
    var rows = await noteDB.listNotes();
    return rows.length > 0;
  }catch(e){ return false; }
}

/**
 * 启动引导：优先 IndexedDB；环境不支持或库为空时读 localStorage。
 * 注意：读不到任何数据时不报错，保留内置示例数据，App 仍可用。
 */
async function bootstrapStore(){
  armFlushHooks();
  if(idbSupported()){
    try{
      await noteDB.open();
      // 先迁移（迁移后 idbHasData 才为真），再统一从 IndexedDB 载入
      var migrated = await migrateLegacyData();
      if(await idbHasData()){
        await loadFromIdb();
        STORAGE_MODE = 'idb';
        if(migrated) toast('已将 '+migrated+' 条历史数据迁移到新存储');
        return;
      }
      // 库为空：没有历史数据，保留内置示例（降级读一次 localStorage 兼容旧版本）
      STORAGE_MODE = 'idb';
      loadFromLocalStorage();
      return;
    }catch(e){ /* IndexedDB 打开失败，降级 */ }
  }
  STORAGE_MODE = 'ls';
  loadFromLocalStorage();
}

/* ---------- 写 ---------- */
function saveDBLegacy(){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({folders:DB.folders, records:DB.records, events:DB.events, settings:DB.settings}));
  } catch(e){
    // 关键：区分「本地存储配额已满」与「手机存储空间不足」——
    // 后者会让用户误以为手机没空间，实际满的是 localStorage 配额
    if(isQuotaError(e)) openNoticeModal('保存失败', describeStorageError(e));
    else toast(describeStorageError(e));
  }
}
async function persistToIdb(){
  try{
    await noteDB.open();
    var list = Object.keys(DB.records).map(function(k){ return DB.records[k]; });
    await noteDB.putManyNotes(list, Date.now());
    await noteDB.setMeta('folders', DB.folders);
    await noteDB.setMeta('events', DB.events);
    await noteDB.setMeta('settings', DB.settings);
    // 删除操作分散在多处，统一按差集清理，避免内存删了库里还在
    var rows = await noteDB.listNotes();
    var alive = {};
    list.forEach(function(r){ alive[r.id] = true; });
    for(var i = 0; i < rows.length; i++){
      if(!alive[rows[i].id]) await noteDB.deleteNote(rows[i].id);
    }
    await noteDB.relinkImages();
    releaseUnusedImageUrls();
    await refreshImageStats();
  }catch(e){
    if(isQuotaError(e)) openNoticeModal('保存失败', describeStorageError(e));
    else toast('保存失败：' + ((e && e.message) || e));
  }
}
/* ---------- 写策略：防抖 + 切后台强制落盘 ---------- */
/** 输入停止 3 秒后写盘，连续输入不会反复触发事务 */
var PERSIST_DELAY = 3000;
var persistTimer = null;
var persistPending = false;

/** 立即落盘（取消未执行的防抖） */
function flushPersist(){
  if(persistTimer){ clearTimeout(persistTimer); persistTimer = null; }
  persistPending = false;
  if(STORAGE_MODE === 'idb') persistToIdb();
  else saveDBLegacy();
}

/**
 * 写盘入口。保持同步签名，所有既有调用点无需改动。
 * 每次调用重置定时器：连续输入只在停顿 3 秒后写一次。
 */
function saveDB(){
  persistPending = true;
  if(persistTimer) clearTimeout(persistTimer);
  persistTimer = setTimeout(function(){
    persistTimer = null;
    flushPersist();
  }, PERSIST_DELAY);
}

/**
 * 页面切后台 / 关闭时立刻落盘。
 * 移动端用户习惯直接划掉 App，不点保存，只靠防抖会丢掉最后 3 秒的编辑。
 */
function armFlushHooks(){
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) flushPersist();
  });
  window.addEventListener('pagehide', flushPersist);
  window.addEventListener('beforeunload', flushPersist);
}

/* ---------- 一次性迁移：localStorage → IndexedDB ---------- */
function dataUrlToBlob(dataUrl){
  return fetch(dataUrl).then(function(res){ return res.blob(); });
}

/**
 * 把 localStorage 时代的旧数据搬进 IndexedDB。
 * - 旧图片是 dataURL，转成 Blob 存入图片仓库（顺带压缩 + 去重），否则迁移后图片会丢
 * - 迁移后保留 localStorage 副本作为回滚保险，不主动删除
 * @returns {Promise<number>} 迁移的笔记条数
 */
async function migrateLegacyData(){
  if(STORAGE_MODE !== 'idb') return 0;
  try{
    await noteDB.open();
    var flag = await noteDB.getMeta('migratedFrom');
    if(flag) return 0;                                   // 已迁移过，不再重复

    var rows = await noteDB.listNotes();
    if(rows.length){ await noteDB.setMeta('migratedFrom', 'fresh'); return 0; }

    var raw = null;
    try { raw = localStorage.getItem(LS_KEY); } catch(e){ raw = null; }
    if(!raw){ await noteDB.setMeta('migratedFrom', 'fresh'); return 0; }

    var parsed = null;
    try { parsed = JSON.parse(raw); } catch(e){ parsed = null; }
    if(!parsed || !parsed.records){ await noteDB.setMeta('migratedFrom', 'fresh'); return 0; }

    var legacy = parsed.records;
    var keys = Object.keys(legacy);
    if(!keys.length){ await noteDB.setMeta('migratedFrom', 'fresh'); return 0; }

    for(var i = 0; i < keys.length; i++){
      var k = keys[i];
      var r = legacy[k];
      r.id = k;
      if(r.image_id === undefined) r.image_id = null;
      // 旧图片是 Base64：转成 Blob 走新管线（压缩 + 去重），不把 Base64 带进新库
      if(typeof r.image === 'string' && r.image.indexOf('data:image/') === 0){
        try{
          var blob = await dataUrlToBlob(r.image);
          var res = await noteDB.saveImage(k, blob);
          r.image_id = res.imageId;
        }catch(e){ /* 单张图迁移失败不阻断整体 */ }
      }
      delete r.image;      // 运行时字段，不入库
    }

    await noteDB.putManyNotes(keys.map(function(k){ return legacy[k]; }), Date.now());
    if(parsed.folders) await noteDB.setMeta('folders', parsed.folders);
    if(parsed.events) await noteDB.setMeta('events', parsed.events);
    if(parsed.settings) await noteDB.setMeta('settings', parsed.settings);
    await noteDB.setMeta('migratedFrom', 'localStorage@v1');
    return keys.length;
  }catch(e){
    return 0;
  }
}

/**
 * 优化存储：清理不再被任何笔记引用的图片（换图、删笔记后的残留）。
 * 图片在入库时已压缩为 WebP，无需再二次压缩，真正的浪费来自孤儿 Blob。
 */
async function optimizeStorage(){
  if(STORAGE_MODE !== 'idb'){ toast('当前为兼容存储模式，无需清理'); return; }
  try{
    var before = await noteDB.imageStats();
    var removed = await noteDB.cleanupOrphanImages();
    await refreshImageStats();
    renderMe();
    if(removed){
      playSound('success');
      toast('已清理 '+removed+' 张无用图片，释放约 '+formatBytes(Math.max(0, before.bytes - imageStatsCache.bytes)));
    } else {
      toast('没有可清理的图片，存储已是最优');
    }
  }catch(e){
    toast('清理失败：'+((e&&e.message)||'未知原因'));
  }
}

/* ============ WHEEL PICKER (滚盘) ============ */
var WHEEL_ITEM_H = 40, WHEEL_VISIBLE = 5;
var wheelState = null, wheelBusy = false;
function sameArray(a, b){
  if(a === b) return true;
  if(!a || !b || a.length !== b.length) return false;
  for(var i=0;i<a.length;i++) if(a[i] !== b[i]) return false;
  return true;
}
/** 单列内容：上下留白，使首尾项也能滚到中央高亮区 */
function wheelColInner(col){
  var pad = (WHEEL_VISIBLE - 1) / 2 * WHEEL_ITEM_H;
  var suffix = col.suffix || '';
  return '<div style="height:' + pad + 'px"></div>'
    + col.options.map(function(o){ return '<div class="wheel-item">' + o + suffix + '</div>'; }).join('')
    + '<div style="height:' + pad + 'px"></div>';
}
/** 按 scrollTop 计算当前选中项并高亮 */
function wheelPick(el, col){
  var idx = Math.round(el.scrollTop / WHEEL_ITEM_H);
  col.value = wheelValue(col.options, idx);
  idx = wheelIndex(col.options, col.value);
  var items = el.querySelectorAll('.wheel-item');
  for(var i=0;i<items.length;i++) items[i].classList.toggle('sel', i===idx);
  if(!wheelBusy) refreshWheelCols();
}
function bindWheelCol(el, col){ el.addEventListener('scroll', function(){ wheelPick(el, col); }); }
/** 某列变化后重建依赖它的列（如切换年/月后重算天数）；内容未变则不重建，避免滚动事件递归 */
function refreshWheelCols(){
  if(!wheelState || wheelBusy) return;
  wheelBusy = true;
  try {
    var values = {};
    wheelState.cols.forEach(function(c){ values[c.key] = c.value; });
    wheelState.cols.forEach(function(col){
      if(typeof col.rebuild !== 'function') return;
      var next = col.rebuild(values);
      if(!next || !next.length || sameArray(next, col.options)) return;
      var found = next.indexOf(col.value);
      var idx = found >= 0 ? found : next.length - 1;
      col.options = next;
      col.value = wheelValue(next, idx);
      var el = document.querySelector('#wheelCols [data-wcol="' + col.key + '"]');
      if(!el) return;
      el.innerHTML = wheelColInner(col);
      bindWheelCol(el, col);
      el.scrollTop = idx * WHEEL_ITEM_H;
      var items = el.querySelectorAll('.wheel-item');
      if(items[idx]) items[idx].classList.add('sel');
    });
  } finally { wheelBusy = false; }
}
/** 打开滚盘：opts {title, cols:[{key,options,value,suffix,rebuild}], onOk(values)} */
function openWheel(opts){
  playSound('pop');
  wheelState = opts;
  document.getElementById('wheelTitle').textContent = opts.title || '请选择';
  var cols = document.getElementById('wheelCols');
  cols.innerHTML = '<div class="wheel-band"></div>'
    + opts.cols.map(function(c){ return '<div class="wheel-col" data-wcol="' + c.key + '">' + wheelColInner(c) + '</div>'; }).join('');
  wheelBusy = true;
  opts.cols.forEach(function(col){
    var el = cols.querySelector('[data-wcol="' + col.key + '"]');
    if(!el) return;
    bindWheelCol(el, col);
    var idx = wheelIndex(col.options, col.value);
    col.value = wheelValue(col.options, idx);
    el.scrollTop = idx * WHEEL_ITEM_H;
    var items = el.querySelectorAll('.wheel-item');
    if(items[idx]) items[idx].classList.add('sel');
  });
  wheelBusy = false;
  document.getElementById('wheelOverlay').classList.add('show');
}
function closeWheel(){ document.getElementById('wheelOverlay').classList.remove('show'); wheelState = null; }
document.getElementById('wheelCancel').addEventListener('click', closeWheel);
document.getElementById('wheelOverlay').addEventListener('click', function(e){ if(e.target===this) closeWheel(); });
document.getElementById('wheelOk').addEventListener('click', function(){
  if(!wheelState){ closeWheel(); return; }
  var values = {}, cb = wheelState.onOk;
  wheelState.cols.forEach(function(c){ values[c.key] = c.value; });
  closeWheel();
  if(cb) cb(values);
});

function openDateWheel(title, init, cb){

/* ============ RENDER: CALENDAR ============ */
var nowInit = new Date();
var calYear = nowInit.getFullYear(), calMonth = nowInit.getMonth();
var calSelected = nowInit.getDate();
function renderCalendar(){
  var maxDay = new Date(calYear, calMonth+1, 0).getDate();
  if(calSelected>maxDay) calSelected=maxDay;
  document.getElementById('calTitle').textContent = calYear+'年'+(calMonth+1)+'月';
  var grid=document.getElementById('calgrid'); grid.innerHTML='';
  var firstDow = (new Date(calYear, calMonth, 1).getDay()+6)%7;
  var days=[]; for(var p=0;p<firstDow;p++) days.push(null);
  for(var d=1;d<=maxDay;d++) days.push(d);
  while(days.length<42) days.push(null);
  var dated={};
  allRecords().forEach(function(k){ var r=DB.records[k]; if(!r.date) return; var pp=r.date.split('-'); if(parseInt(pp[0],10)===calYear && parseInt(pp[1],10)===calMonth+1){ var dd=parseInt(pp[2],10); dated[dd]=(dated[dd]||0)+1; } });
  var tArr=TODAY.split('-'); var tY=parseInt(tArr[0],10), tM=parseInt(tArr[1],10), tD=parseInt(tArr[2],10);
  days.forEach(function(d){
    var cell=document.createElement('div'); cell.className='calcell';
    if(d===null){ cell.classList.add('empty'); }
    else{
      cell.textContent=d;
      if(calYear===tY && calMonth+1===tM && d===tD) cell.classList.add('today');
      if(dated[d]) cell.classList.add('has');
      if(d===calSelected) cell.classList.add('sel');
      var mk=getDayMarks(calYear, calMonth+1, d, DB.events);
      var dots=[];
      if(dated[d]) dots.push('rec');
      mk.terms.forEach(function(){ dots.push('term'); });
      mk.festivals.forEach(function(){ dots.push('festival'); });
      mk.customs.forEach(function(){ dots.push('custom'); });
      if(dots.length){ var md=document.createElement('div'); md.className='calmark'; md.innerHTML=dots.map(function(c){ return '<span class="cm-'+c+'"></span>'; }).join(''); cell.appendChild(md); }
      cell.setAttribute('data-day', d);
    }
    grid.appendChild(cell);
  });
  var recs = allRecords().filter(function(k){ var r=DB.records[k]; if(!r.date) return false; var pp=r.date.split('-'); return parseInt(pp[0],10)===calYear && parseInt(pp[1],10)===calMonth+1 && parseInt(pp[2],10)===calSelected; });
  var wd=['日','一','二','三','四','五','六'][new Date(calYear,calMonth,calSelected).getDay()];
  var mk=getDayMarks(calYear, calMonth+1, calSelected, DB.events);
  var markItems=[];
  mk.terms.forEach(function(t){ markItems.push({label:t, cls:'dm-term'}); });
  mk.festivals.forEach(function(t){ markItems.push({label:t, cls:'dm-festival'}); });
  mk.customs.forEach(function(e){ markItems.push({label:e.name, cls:'dm-custom', id:e.id}); });
  var markHtml='';
  if(markItems.length){ markHtml='<div class="daymarks">'+markItems.map(function(it){ return '<span class="daymark '+it.cls+'">'+(it.id?'<span class="dm-del" data-del-event="'+it.id+'">×</span>':'')+it.label+'</span>'; }).join('')+'</div>'; }
  document.getElementById('dayPanel').innerHTML='<div class="t-section">'+calYear+'年'+(calMonth+1)+'月'+calSelected+'日 · 周'+wd+'</div><div class="t-meta">当日 '+recs.length+' 条记录</div>'+markHtml+'<div class="row-center" style="margin-top:8px"><span class="link-blue" data-add-event>＋ 添加重要日子</span></div>';
  var html = recs.map(function(k){
    var r=DB.records[k];
    return '<div class="rec" data-rec="'+k+'"><div class="left"><div class="badge '+r.type+'">'+(r.type==='plan'?'计划':'复盘')+'</div><div class="rtext"><div class="t-rec-title">'+r.title+'</div><div class="t-meta">'+r.time+'</div></div></div><svg class="chev-gray" width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M1 1L8 8L1 15" stroke="#A0A4AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
  }).join('');
  if(!html) html='<div class="empty-hint">这一天还没有记录</div>';
  document.getElementById('calRecords').innerHTML=html;
}

/* ============ RENDER: STATS ============ */
function renderStats(){
  var recs=allRecords().map(function(k){return DB.records[k];});
  var plans=recs.filter(function(r){return r.type==='plan';});
  var reviews=recs.filter(function(r){return r.type==='review';});
  var total=0, done=0;
  plans.forEach(function(p){ if(!p.checklist.length){ total+=1; done+=1; } else { total+=p.checklist.length; done+=p.checklist.filter(function(c){return c.c;}).length; } });
  var rate = total? Math.round(done/total*100):0;
  var streak=0; var cur=new Date();
  while(true){ var key=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
    var has=reviews.some(function(r){return r.date===key;}); if(!has) break; streak++; cur.setDate(cur.getDate()-1); if(streak>365) break; }
  var trend=[]; for(var i=6;i>=0;i--){ var dt=new Date(); dt.setDate(dt.getDate()-i); var kk=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); trend.push(recs.filter(function(r){return r.date===kk;}).length); }
  var maxT=Math.max.apply(null,trend.concat([1]));
  var bars=trend.map(function(v){ return '<div class="bar" style="height:'+Math.max(6,Math.round(v/maxT*88))+'px"></div>'; }).join('');
  var tagCount={}; recs.forEach(function(r){ (r.tags||[]).forEach(function(t){ tagCount[t]=(tagCount[t]||0)+1; }); });
  var tagHtml=Object.keys(tagCount).length? Object.keys(tagCount).map(function(t){ return '<div class="tag" data-tag="'+t+'">'+t+' '+tagCount[t]+'</div>'; }).join('') : '<div class="empty-hint">暂无标签</div>';
  document.getElementById('statsContent').innerHTML =
    '<div class="head"><div class="title" style="font-size:18px">统计</div><div class="period" id="periodBtn">本周 ▾</div></div>'
   +'<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:6px"><div class="t-label">计划完成率</div><div class="mbig-blue">'+rate+'%</div><div class="t-sub">已完成 '+done+' / 共 '+total+' 项</div></div>'
   +'<div class="metric-row"><div class="card"><div class="t-label">复盘篇数</div><div class="mbig-orange">'+reviews.length+'</div></div><div class="card"><div class="t-label">连续复盘</div><div class="mbig-green">'+streak+' 天</div></div></div>'
   +'<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px"><div class="t-section">近 7 日记录数</div><div class="bars">'+bars+'</div></div>'
   +'<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px"><div class="t-section">标签分布</div><div class="tags">'+tagHtml+'</div></div>';
}

/* ============ EXPORT ============ */
/* 导出目录：优先写入用户选择的文件夹，未选择时落到系统默认下载目录 */
var exportDirHandle = null;   // FileSystemDirectoryHandle
var exportDirLabel  = null;   // 目录名，用于展示与路径提示
var EXPORT_DIR_IDB  = 'work-memo-export-dir';

/** 极简 IndexedDB 封装：目录句柄可结构化克隆后持久化到 IDB，便于下次启动复用 */
function idbHandle(mode, fn){
  return new Promise(function(resolve, reject){
    var req;
    try { req = indexedDB.open('work-memo-fs', 1); } catch(e){ reject(e); return; }
    req.onupgradeneeded = function(){ if(!req.result.objectStoreNames.contains('handles')) req.result.createObjectStore('handles'); };
    req.onsuccess = function(){
      var db = req.result, out;
      try {
        var tx = db.transaction('handles', mode);
        out = fn(tx.objectStore('handles'));
        tx.oncomplete = function(){ db.close(); resolve(out && 'result' in out ? out.result : undefined); };
        tx.onerror = function(){ db.close(); reject(tx.error); };
      } catch(e){ db.close(); reject(e); }
    };
    req.onerror = function(){ reject(req.error); };
  });
}
function saveExportDirHandle(h){ return idbHandle('readwrite', function(s){ return s.put(h, EXPORT_DIR_IDB); }).catch(function(){}); }
function loadExportDirHandle(){ return idbHandle('readonly', function(s){ return s.get(EXPORT_DIR_IDB); }).catch(function(){ return null; }); }
function clearExportDirHandle(){ return idbHandle('readwrite', function(s){ return s.delete(EXPORT_DIR_IDB); }).catch(function(){}); }

/** 确保对已选目录仍有写权限（句柄持久化后再次访问通常需要重新授权） */
async function ensureExportDirWritable(){
  if(!exportDirHandle) return false;
  var opts = { mode:'readwrite' };
  try {
    var perm = exportDirHandle.queryPermission ? await exportDirHandle.queryPermission(opts) : 'granted';
    if(perm !== 'granted' && exportDirHandle.requestPermission){ perm = await exportDirHandle.requestPermission(opts); }
    return perm === 'granted';
  } catch(e){ return false; }
}

/** 选择导出文件夹 */
async function pickExportDir(){
  if(!supportsDirectoryPicker(window)){
    openNoticeModal('不支持选择文件夹', '当前环境不支持自定义导出文件夹，文件将继续保存到系统「下载」目录。');
    return;
  }
  try {
    var handle = await window.showDirectoryPicker({ id:'work-memo-export', mode:'readwrite' });
    exportDirHandle = handle; exportDirLabel = handle.name || '所选文件夹';
    await saveExportDirHandle(handle);
    renderMe(); playSound('success'); toast('导出文件夹已设为：' + exportDirLabel);
  } catch(e){
    if(e && e.name === 'AbortError') return;   // 用户主动取消
    toast('选择文件夹失败，请重试');
  }
}
/** 恢复默认下载目录 */
function clearExportDir(){
  exportDirHandle = null; exportDirLabel = null;
  clearExportDirHandle();
  renderMe(); playSound('delete'); toast('已恢复默认下载目录');

/** 把内容写入用户选择的目录 */
async function writeToExportDir(fileName, blob){
  var fh = await exportDirHandle.getFileHandle(fileName, { create:true });
  var w = await fh.createWritable();
  await w.write(blob);
  await w.close();
}

function blobToDataUrl(blob){
  return new Promise(function(resolve, reject){
    var rd=new FileReader();
    rd.onload=function(ev){ resolve(ev.target.result); };
    rd.onerror=function(){ reject(rd.error||new Error('读取失败')); };
    rd.readAsDataURL(blob);
  });
}
/**
 * 导出用的记录副本：
 *  - 剔除运行时的 blob URL（换台设备就失效，导出它没有任何意义）
 *  - 把图片 Blob 内联带走，保证备份能还原照片
 * 说明：内联只发生在导出文件里，不写回数据库，不违反「图片禁止 Base64 入库」。
 */
async function buildExportRecords(){
  var out={};
  var keys=Object.keys(DB.records);
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    var rec=clone(DB.records[k]);
    delete rec.image;
    if(rec.image_id && STORAGE_MODE==='idb'){
      try{
        var row=await noteDB.getImage(rec.image_id);
        var blob=row&&(row.blob_full||row.blob_thumb);
        if(blob) rec.image_base64=await blobToDataUrl(blob);
      }catch(e){ /* 单张图缺失不阻断整体导出 */ }
    }
    out[k]=rec;
  }
  return out;
}

async function exportData(){
  var payload = { exportedAt:new Date().toISOString(), folders:DB.folders, records:await buildExportRecords(), events:DB.events };
  var fileName = buildExportFilename('工作计划与复盘-导出', getTodayStr(), 'json');
  var blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  var savedDir = null, failed = false;

  if(exportDirHandle){
    // 已选择自定义文件夹：直接写入该目录
    if(await ensureExportDirWritable()){
      try { await writeToExportDir(fileName, blob); savedDir = exportDirLabel; }
      catch(e){ failed = true; }
    } else { failed = true; }
    if(failed){
      openNoticeModal('导出失败', '无法写入所选文件夹「' + (exportDirLabel||'') + '」，可能是授权已失效。\n请重新选择导出文件夹后再试。');
      return;
    }
  } else {
    // 未选择自定义文件夹：走浏览器 / 系统默认下载
    var url = URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=fileName; a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  var target = buildExportTarget(fileName, savedDir);
  var info = describeExportLocation(fileName, savedDir);
  openNoticeModal('导出成功', info.message);
  toast('已导出：' + target.path); playSound('success');
}

  var bu=e.target.closest('[data-bg-upload]'); if(bu){ document.getElementById('bgFile').click(); return; }
  // selection bar: cancel
  var sc=e.target.closest('#selCancel'); if(sc){ exitSelectionMode(); return; }
  // selection bar: delete
  var sd=e.target.closest('#selDelete'); if(sd){ deleteSelectedConfirm(); return; }
  // selection mode: toggle item checkbox
  var sel=e.target.closest('[data-sel]'); if(sel){ toggleSel(sel.getAttribute('data-sel')); return; }
  // back
  var back=e.target.closest('[data-back]'); if(back){ if(navStack.length>1) navStack.pop(); var prev=navStack[navStack.length-1]; if(prev.screen==='folder'){ renderFolder(prev.id); } else if(prev.screen==='plan'||prev.screen==='review'){ loadEditor(prev.type, prev.recId, prev.folderId); paintEditor(); } else if(prev.screen==='home'){ renderHome(); } else if(prev.screen==='search'){ renderSearch(document.getElementById('searchInput').value); } else if(prev.screen==='calendar'){ renderCalendar(); } else if(prev.screen==='stats'){ renderStats(); } show(prev.screen); return; }
  // home folder row
  var fr=e.target.closest('[data-folder]'); if(fr){ goFolder(fr.getAttribute('data-folder')); return; }
  // search result folder/record
  var sres=e.target.closest('#searchContent [data-folder]'); if(sres){ goFolder(sres.getAttribute('data-folder')); return; }
  var srec=e.target.closest('#searchContent [data-rec]'); if(srec){ openRecord(srec.getAttribute('data-rec')); return; }
  // folder detail: subfolder (selection mode toggles instead of navigate)
  var sub=e.target.closest('[data-sub]'); if(sub){ if(selectionMode){ toggleSel(sub.getAttribute('data-sub')); } else { goFolder(sub.getAttribute('data-sub')); } return; }
  // folder detail: breadcrumb segment
  var seg=e.target.closest('[data-crumb]'); if(seg){ var idx=parseInt(seg.getAttribute('data-crumb'),10); var p=pathOf(currentFolder); var target=null; for(var id in DB.folders){ if(DB.folders[id].name===p[idx] && pathOf(id).length-1===idx){ target=id; break; } } if(target!==null) goFolder(target); return; }
  // folder detail: new subfolder
  var ns=e.target.closest('[data-newsub]'); if(ns){ openPromptModal('新建子文件夹', '输入文件夹名称', '未命名文件夹', function(v){ var name=(v||'').trim(); if(name){ var nid='u'+Date.now(); DB.folders[nid]={name:name,parent:currentFolder,color:'accent'}; saveDB(); renderFolder(currentFolder); } }); return; }
  // folder detail: new record
  var nr=e.target.closest('[data-newrec]'); if(nr){ newRecord(nr.getAttribute('data-newrec')); return; }
  // record row (selection mode toggles instead of navigate)
  var rec=e.target.closest('[data-rec]'); if(rec){ if(selectionMode){ toggleSel(rec.getAttribute('data-rec')); } else { openRecord(rec.getAttribute('data-rec')); } return; }
  // tabs
  var tab=e.target.closest('.tab'); if(tab){ var tid=tab.getAttribute('data-tab'); if(tid==='me'){ navTo('me'); return; } navStack=[{screen: tid==='folders'?'home':tid}]; if(tid==='folders') renderHome(); if(tid==='stats') renderStats(); if(tid==='calendar') renderCalendar(); show(tid==='folders'?'home':tid); return; }
  // calendar prev month
  var cp=e.target.closest('[data-cal-prev]'); if(cp){ playSound('tap'); calMonth--; if(calMonth<0){ calMonth=11; calYear--; } renderCalendar(); return; }
  // calendar next month
  var cn=e.target.closest('[data-cal-next]'); if(cn){ playSound('tap'); calMonth++; if(calMonth>11){ calMonth=0; calYear++; } renderCalendar(); return; }
  // calendar jump to year/month
  var cj=e.target.closest('[data-cal-jump]'); if(cj){ openPromptModal('跳转到年月', '格式 YYYY-MM', calYear+'-'+String(calMonth+1).padStart(2,'0'), function(v){ if(v && /^\d{4}-\d{1,2}$/.test(v)){ var pp=v.split('-'); var yy=parseInt(pp[0],10), mm=parseInt(pp[1],10)-1; if(yy>=1970 && yy<=2100 && mm>=0 && mm<=11){ calYear=yy; calMonth=mm; calSelected=1; renderCalendar(); } } }); return; }
  // calendar day
  var day=e.target.closest('.calcell[data-day]'); if(day){ playSound('tap'); calSelected=parseInt(day.getAttribute('data-day'),10); renderCalendar(); return; }
  // calendar: add custom important day
  var ae=e.target.closest('[data-add-event]'); if(ae){ openEventModal(); return; }
  // calendar: delete custom important day
  var de=e.target.closest('[data-del-event]'); if(de){ deleteCustomEvent(de.getAttribute('data-del-event')); return; }
  // stats tag filter
  var tag=e.target.closest('[data-tag]'); if(tag){ document.getElementById('searchInput').value=tag.getAttribute('data-tag'); renderSearch(tag.getAttribute('data-tag')); show('search'); return; }
  // editor save
  var sv=e.target.closest('[data-save]'); if(sv){ saveEditor(); return; }
  // editor delete
  var del=e.target.closest('[data-delete-rec]'); if(del){ deleteCurrentRecord(); return; }
  // folder menu
  var fm=e.target.closest('[data-folder-menu]'); if(fm){ openFolderMenu(); return; }
  // priority filter toggle
  var pf=e.target.closest('[data-priority-filter]'); if(pf){ priorityFilter=true; renderFolder(currentFolder); playSound('tap'); return; }
  var pfo=e.target.closest('[data-priority-filter-off]'); if(pfo){ priorityFilter=false; renderFolder(currentFolder); playSound('tap'); return; }
});

/* ============ FOLDER OPERATIONS ============ */
function openFolderMenu(){
  if(selectionMode) return;
  openSheet([{label:'重命名'}, {label:'选择性删除'}, {label:'一键清空', danger:true}, {label:'删除文件夹', danger:true}], function(idx){
    if(idx===0){
      openPromptModal('重命名文件夹', '新名称', DB.folders[currentFolder].name, function(v){ var name=(v||'').trim(); if(name){ DB.folders[currentFolder].name=name; saveDB(); renderFolder(currentFolder); } });
    } else if(idx===1){
      enterSelectionMode();
    } else if(idx===2){
      clearFolderConfirm();
    } else if(idx===3){
      deleteFolderConfirm();
    }
  });
}
function deleteFolderConfirm(){
  openConfirmModal('删除文件夹', '该文件夹及其子文件夹、记录都会被删除，确定吗？', function(ok){ if(ok){ deleteFolder(currentFolder); saveDB(); playSound('delete'); navStack=[{screen:'home'}]; renderHome(); show('home'); } });
}
function enterSelectionMode(){ selectionMode=true; priorityFilter=false; selectedItems={}; renderFolder(currentFolder); showSelbar(); }
function exitSelectionMode(){ selectionMode=false; selectedItems={}; renderFolder(currentFolder); hideSelbar(); }
function showSelbar(){ document.getElementById('selbar').classList.add('show'); updateSelCount(); }
function hideSelbar(){ document.getElementById('selbar').classList.remove('show'); }
function updateSelCount(){ var n=Object.keys(selectedItems).length; document.getElementById('selCount').textContent='已选择 '+n+' 项'; document.getElementById('selDelete').textContent=n?'删除 ('+n+')':'删除'; }
function toggleSel(id){ playSound('toggle'); if(selectedItems[id]) delete selectedItems[id]; else selectedItems[id]=true; updateSelCount(); renderFolder(currentFolder); }
function deleteSelectedConfirm(){
  var ids=Object.keys(selectedItems); if(!ids.length){ toast('请先选择要删除的内容'); return; }
  openConfirmModal('删除选中内容', '确定删除选中的 '+ids.length+' 项吗？', function(ok){
    if(ok){ var res=deleteSelectedItems(ids, DB.folders, DB.records); DB.folders=res.folders; DB.records=res.records; saveDB(); exitSelectionMode(); toast('已删除'); playSound('delete'); }
  });
}
function clearFolderConfirm(){
  openConfirmModal('一键清空', '将清空该文件夹下的所有子文件夹和记录，文件夹本身保留。确定吗？', function(ok){
    if(ok){ var res=clearFolderContents(currentFolder, DB.folders, DB.records); DB.folders=res.folders; DB.records=res.records; saveDB(); renderFolder(currentFolder); toast('已清空'); playSound('delete'); }
  });
}
function deleteFolder(id){
  // recursive children
  childrenOf(id).forEach(function(cid){ deleteFolder(cid); });
  // records in this folder
  recordsOf(id).forEach(function(rid){ delete DB.records[rid]; });
  delete DB.folders[id];
}

/* ============ EDITOR ============ */
var editing = null;
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
var CHECK_SVG = '<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1.5 4.5L4 7L9.5 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var REMINDER_SVG = '<svg width="12" height="14" viewBox="0 0 12 14" fill="none"><path d="M6 1.5C4.2 1.5 3 2.9 3 4.7V7.5L1.8 9.7V10.5H10.2V9.7L9 7.5V4.7C9 2.9 7.8 1.5 6 1.5Z" stroke="#4F6EF7" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 12.2H7" stroke="#4F6EF7" stroke-width="1.4" stroke-linecap="round"/></svg>';
var DATE_SVG = '<svg width="12" height="14" viewBox="0 0 12 14" fill="none"><rect x="1" y="2.5" width="10" height="10" rx="1.5" stroke="#4F6EF7" stroke-width="1.4"/><path d="M1 5.5H11M4 1V3.5M8 1V3.5" stroke="#4F6EF7" stroke-width="1.4" stroke-linecap="round"/></svg>';

function loadEditor(type, recId, folderId){
  if(recId){ var r=DB.records[recId]; editing={id:recId, type:type, folderId:r.folderId, isNew:false, data:clone(r)}; }
  else { var fid=folderId||currentFolder||'work'; editing={id:null, type:type, folderId:fid, isNew:true, data:{type:type, folderId:fid, title:'', date:TODAY, time:getNowTime(), reminder:null, tags:[], priority:0, image:null, checklist:[], body:'', linkPlanId:null}}; }
}
function renderTags(tags){ return (tags||[]).map(function(t){ return '<div class="tag" data-tag-del="'+t+'">#'+escapeHtml(t)+'</div>'; }).join(''); }
function renderChecklist(type, list, label){
  var items=list.map(function(c,i){ return '<div class="citem" data-ci="'+i+'"><div class="cb '+(c.c?'on':'off')+'" data-cb>'+(c.c?CHECK_SVG:'')+'</div><div class="t-body" contenteditable="true" data-citext style="outline:none;flex:1">'+escapeHtml(c.t)+'</div><div class="cdel" data-cdel="'+i+'">×</div></div>'; }).join('');

  } else {
    html+='<button class="reminder" id="'+type+'Date">'+DATE_SVG+'<span>'+d.date+'</span></button>';

/**
 * 编辑过程中自动存草稿：把改动写回内存记录并触发防抖落盘（3 秒）。
 * 只对「已存在的记录」生效 —— 新建记录仍须点对勾才入库，
 * 以保留「返回键 = 放弃未保存改动」的既定语义。
 */
function autoSaveDraft(){
  if(!editing || editing.isNew) return;
  if(!DB.records[editing.id]) return;
  DB.records[editing.id] = clone(editing.data);
  saveDB();
}
function bindEditor(type){
  var c=document.getElementById(type+'Content');
  var titleEl=document.getElementById(type+'Title'); if(titleEl) titleEl.addEventListener('input', function(){ editing.data.title=this.textContent; autoSaveDraft(); });
  var bodyEl=document.getElementById(type+'Body'); if(bodyEl) bodyEl.addEventListener('input', function(){ editing.data.body=this.textContent; autoSaveDraft(); });
  c.querySelectorAll('[data-priority]').forEach(function(seg){ seg.addEventListener('click', function(){ var level=parseInt(seg.getAttribute('data-priority'),10); editing.data.priority=level; c.querySelectorAll('[data-priority]').forEach(function(s){ var l=parseInt(s.getAttribute('data-priority'),10); var m=getPriorityMeta(l); var isActive=l===level; s.classList.toggle('active',isActive); s.style.background=isActive?m.color:''; }); playSound('toggle'); autoSaveDraft(); }); });
  // 提醒时间：滚盘选择，取代手动输入 HH:MM
  var rem=document.getElementById(type+'Reminder'); if(rem) rem.addEventListener('click', function(){
    var cur=parseWheelTime(editing.data.reminder) || { h:18, m:0 };
    openTimeWheel('设置提醒时间', cur, function(v){
      var t=formatWheelTime(v.hour, v.minute);
      editing.data.reminder=t;
      document.getElementById(type+'Reminder').querySelector('span').textContent=t+' 提醒';
      toast('已设置提醒：'+t); scheduleReminder(t);
    });
  });
  // 记录日期：滚盘选择，取代手动输入 YYYY-MM-DD
  var dateEl=document.getElementById(type+'Date'); if(dateEl) dateEl.addEventListener('click', function(){
    var cur=parseWheelDate(editing.data.date) || parseWheelDate(TODAY) || { y:1970, m:1, d:1 };
    openDateWheel('选择日期', cur, function(v){
      var d=formatWheelDate(v.year, v.month, v.day);
      editing.data.date=d;
      document.getElementById(type+'Date').querySelector('span').textContent=d;
    });
  });
  c.querySelectorAll('[data-cb]').forEach(function(cb){ cb.addEventListener('click', function(ev){ ev.stopPropagation(); playSound('toggle'); var ci=parseInt(cb.getAttribute('data-ci'),10); var on=cb.classList.contains('on'); cb.classList.toggle('on',!on); cb.classList.toggle('off',on); var svg=cb.querySelector('svg'); if(!on){ if(!svg) cb.innerHTML=CHECK_SVG; } else { if(svg) svg.remove(); } editing.data.checklist[ci].c=!on; autoSaveDraft(); }); });
  c.querySelectorAll('[data-citext]').forEach(function(t){ t.addEventListener('input', function(){ var ci=parseInt(t.closest('[data-ci]').getAttribute('data-ci'),10); editing.data.checklist[ci].t=this.textContent; autoSaveDraft(); }); });
  c.querySelectorAll('[data-cdel]').forEach(function(btn){ btn.addEventListener('click', function(ev){ ev.stopPropagation(); var ci=parseInt(btn.getAttribute('data-cdel'),10); editing.data.checklist=deleteChecklistItem(editing.data.checklist, ci); paintEditor(); }); });
  var addci=c.querySelector('[data-addci]'); if(addci) addci.addEventListener('click', function(){ playSound('toggle'); editing.data.checklist.push({t:'新事项',c:false}); paintEditor(); });
  var tagsEl=document.getElementById(type+'Tags'); if(tagsEl) tagsEl.addEventListener('click', function(e){ var tag=e.target.closest('[data-tag-del]'); if(tag){ var t=tag.getAttribute('data-tag-del'); editing.data.tags=editing.data.tags.filter(function(x){return x!==t;}); paintEditor(); return; } if(e.target.classList.contains('tag') && e.target.textContent.indexOf('+')<0) return;
    openPromptModal('添加标签', '如：重要', '', function(v){ var t=(v||'').trim(); if(t){ editing.data.tags.push(t.replace(/^#/,'')); paintEditor(); } });
  });
  var imgEl=document.getElementById(type+'Img'); if(imgEl) imgEl.addEventListener('click', function(){ if(hasImage(editing.data)){ lightboxType=type; openLightbox(editing.data.image); } else { currentImgTarget=type+'Img'; document.getElementById('imgFile').click(); } });
  var lk=c.querySelector('[data-link-choose]'); if(lk) lk.addEventListener('click', chooseLinkPlan);
}
function chooseLinkPlan(){
  var plans=Object.keys(DB.records).filter(function(k){ return DB.records[k].type==='plan'; });
  if(!plans.length){ toast('暂无可选计划'); return; }
  var items=plans.map(function(k){ return {label:DB.records[k].title}; });
  openSheet(items, function(idx){ if(plans[idx]){ editing.data.linkPlanId=plans[idx]; paintEditor(); } });
}
function saveEditor(){
  if(!editing) return;
  var d=editing.data;
  var tEl=document.getElementById(editing.type+'Title'); if(tEl) d.title=tEl.textContent.trim();
  var bEl=document.getElementById(editing.type+'Body'); if(bEl) d.body=bEl.textContent;
  if(!d.title) d.title=(editing.type==='plan'?'未命名计划':'未命名复盘');
  var isNew=editing.isNew;
  if(isNew){ var nid='r'+Date.now(); d.folderId=editing.folderId; d.id=nid; DB.records[nid]=clone(d); editing.id=nid; editing.data.id=nid; editing.isNew=false; }
  else { d.id=editing.id; DB.records[editing.id]=clone(d); }
  saveDB();
  /* 保存后重新登记所有已保存记录的提醒（含本条），避免仅前台 setTimeout 在重启后丢失 */
  clearTimerList(previewTimers);
  armAllReminders();
  /* 同时安排原生本地通知，确保 App 退到后台或被清掉后仍能响铃 */
  initLocalNotifications();
  scheduleRecordNotification(DB.records[editing.id]);
  toast(isNew?'已新建并保存':'已保存');
  playSound('success');
  renderFolder(editing.folderId);
  navStack[navStack.length-1]={screen:'folder', id:editing.folderId};
  show('folder');
}
function deleteCurrentRecord(){
  if(!editing || editing.isNew) return;
  openConfirmModal('删除记录', '确定删除“'+(editing.data.title||'未命名')+'”吗？此操作不可恢复。', function(ok){ if(ok){ var rid=editing.id; cancelRecordNotification(rid); delete DB.records[rid]; saveDB(); toast('已删除'); playSound('delete'); var fid=editing.folderId; navStack=[{screen:'folder', id:fid}]; renderFolder(fid); show('folder'); } });
}
/* ============ REMINDER (闹钟 + 12306 式多级提醒) ============ */
/* reminderTimers: 已保存记录登记的提醒；previewTimers: 当前编辑中、尚未保存的提醒 */
var reminderTimers = [], previewTimers = [];
function clearTimerList(list){ list.forEach(function(t){ clearTimeout(t); }); list.length = 0; }
/** 申请系统通知权限（需在用户交互后调用） */
function ensureNotifyPermission(){
  if(typeof Notification === 'undefined') return Promise.resolve(false);
  if(Notification.permission === 'granted') return Promise.resolve(true);
  if(Notification.permission === 'denied') return Promise.resolve(false);
  try { return Notification.requestPermission().then(function(p){ return p === 'granted'; }); }
  catch(e){ return Promise.resolve(false); }
}
/** 触发一次提醒：系统通知 + 震动 + 音效 + 应用内提示（即使退到后台也能收到通知） */
function fireAlarm(label, title){
  playSound('success');
  try { if(navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch(e){}
  try {
    if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
      new Notification('⏰ ' + label, { body: title || '计划', tag: 'work-memo-reminder' });
    }
  } catch(e){}
  toast('⏰ ' + label + '：' + (title || '计划'));
}
/** 按提醒方案为一条记录登记多级提醒，返回登记条数 */
function armReminders(record, plan, list){
  var target = combineDateTime(record.date, record.reminder);
  if(!isFinite(target)) return 0;
  var now = Date.now();
  var schedule = buildReminderSchedule(target, now, plan);
  schedule.forEach(function(item){
    var delay = Math.max(0, item.at - now);
    list.push(setTimeout(function(){ fireAlarm(item.label, record.title); }, delay));
  });
  return schedule.length;
}
/** 重新登记所有已保存记录的提醒（应用重启后 setTimeout 会丢失） */
function armAllReminders(){
  clearTimerList(reminderTimers);
  var total = 0;
  Object.keys(DB.records).forEach(function(k){
    var r = DB.records[k];
    if(!r.reminder || !r.date) return;
    total += armReminders(r, DEFAULT_REMINDER_PLAN, reminderTimers);
  });
  return total;
}
/** 编辑器里设定提醒时间后调用：登记当前编辑记录的提醒（尚未保存，属预览） */
function scheduleReminder(time){
  if(!editing) return;
  clearTimerList(previewTimers);
  var n = armReminders(editing.data, DEFAULT_REMINDER_PLAN, previewTimers);
  ensureNotifyPermission();
  if(n) toast('已设置 ' + n + ' 次提醒，最后一次在到点');
  else toast('该时间点已过，未登记提醒');
}
/* ============ 原生本地通知（Capacitor LocalNotifications，后台/杀进程后仍可提醒） ============ */
var LN = null;
function initLocalNotifications(){
  if(LN) return;
  try {
    var Cap = (typeof window !== 'undefined' && window.Capacitor) ? window.Capacitor : null;
    if(Cap && Cap.Plugins && Cap.Plugins.LocalNotifications) LN = Cap.Plugins.LocalNotifications;
  } catch(e){ LN = null; }
}
function recordNotifyId(recordId){
  var h = 0;
  for(var i = 0; i < String(recordId).length; i++) h = ((h * 31) + String(recordId).charCodeAt(i)) >>> 0;
  return h % 2147483647;
}
function scheduleRecordNotification(record){
  return Promise.resolve().then(function(){
    initLocalNotifications();
    if(!LN || !record || !record.id || !record.reminder || !record.date) return false;
    var target = combineDateTime(record.date, record.reminder);
    if(!isFinite(target) || target <= Date.now()) return false;
    return LN.requestPermissions().then(function(p){
      if(p && p.display === 'denied') return false;
      return LN.schedule({
        notifications: [{
          id: recordNotifyId(record.id),
          title: '⏰ ' + (record.title || '计划'),
          body: '到点提醒：' + (record.title || '计划'),
          schedule: { at: new Date(target) },
          sound: 'default',
          smallIcon: 'ic_launcher',
          iconColor: '#4F6EF7'
        }]
      }).then(function(){ return true; }).catch(function(e){ console.error('LN schedule', e); return false; });
    });
  });
}
function cancelRecordNotification(recordId){
  initLocalNotifications();
  if(!LN || !recordId) return Promise.resolve(false);
  return LN.cancel({ notifications: [{ id: recordNotifyId(recordId) }] })
    .then(function(){ return true; }).catch(function(){ return false; });
}
function cancelAllRecordNotifications(){
  initLocalNotifications();
  if(!LN) return Promise.resolve(false);
  return LN.cancel({}).then(function(){ return true; }).catch(function(){ return false; });
}
async function rescheduleAllNotifications(){
  try{
    initLocalNotifications();
    if(!LN) return 0;
    await cancelAllRecordNotifications();
    var total = 0;
    Object.keys(DB.records).forEach(function(k){
      var r = DB.records[k];
      if(r && r.reminder && r.date){ scheduleRecordNotification(r); total++; }
    });
    return total;
  }catch(e){
    // 系统通知不可用只是少一个提醒渠道，绝不能影响 App 本身
    return 0;
  }
}
var currentImgTarget=null;
document.getElementById('imgFile').addEventListener('change', function(){
  var file=this.files&&this.files[0]; if(!file) return;
  this.value='';
  handleImagePick(file).catch(function(e){
    toast('图片插入失败：'+((e&&e.message)||'未知原因'));
  });
});
/**
 * 选图入库（新管线）：
 *   WebP 压缩 → SHA-256 去重 → Blob 存 IndexedDB → 转 objectURL 供渲染
 * 图片不再以 Base64 dataURL 混在业务数据里（体积 +33%，且整块进内存）。
 */
async function handleImagePick(file){
  if(!editing) return;
  var noteId = editing.id || editing.data.id || null;
  var res = await noteDB.saveImage(noteId, file);
  editing.data.image_id = res.imageId;
  var row = await noteDB.getImage(res.imageId);
  var blob = row && (row.blob_full || row.blob_thumb);
  if(blob){
    var url = URL.createObjectURL(blob);
    imageUrlCache[res.imageId] = url;
    editing.data.image = url;
  }
  var el=document.getElementById(currentImgTarget||'');
  if(el && editing.data.image){ el.style.backgroundImage='url('+editing.data.image+')'; el.classList.add('has-img'); el.textContent=''; }
  playSound('pop');
  saveDB();
  toast(res.deduped
    ? '这张图已存过，已复用（不额外占用空间）'
    : ('已压缩保存 · ' + formatBytes(res.bytes)));
}
/**
 * 读取图片并压缩：按最大边长等比缩放后转 JPEG data URL。
 * 原图直接转 dataURL 可达数 MB，远超 localStorage 配额（约 5MB），
 * 会导致 saveDB 抛 QuotaExceededError，被误报成「存储空间不足」。
 */
function compressImageFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var rd=new FileReader();
    rd.onerror=function(){ reject(rd.error || new Error('读取失败')); };
    rd.onload=function(ev){
      var img=new Image();
      img.onerror=function(){ reject(new Error('图片解析失败')); };
      img.onload=function(){
        var r=computeResize(img.naturalWidth, img.naturalHeight, maxDim);
        var canvas=document.createElement('canvas');
        canvas.width=r.width; canvas.height=r.height;
        var ctx=canvas.getContext('2d');
        if(!ctx){ reject(new Error('无法处理图片')); return; }
        ctx.drawImage(img, 0, 0, r.width, r.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src=ev.target.result;
    };
    rd.readAsDataURL(file);
  });
}
document.getElementById('bgFile').addEventListener('change', function(){
  var file=this.files&&this.files[0]; if(!file) return;
  this.value='';
  var before=file.size;
  compressImageFile(file, IMAGE_LIMITS.bgMaxDim, IMAGE_LIMITS.bgQuality).then(function(dataUrl){
    var after=estimateDataUrlBytes(dataUrl);
    var s=DB.settings; s.bgImage=dataUrl;
    applyBackground(s.bgImage); saveDB(); renderMe(); playSound('success');
    toast('背景已设置：'+formatBytes(before)+' → '+formatBytes(after));
  }).catch(function(e){
    toast('背景设置失败：'+((e&&e.message)||'未知原因'));
  });
});
/* lightbox for previewing uploaded images */
var lightboxType=null;
/* lightbox for previewing uploaded images (with zoom / pan) */
var lbScale=1, lbTX=0, lbTY=0;          // 当前缩放倍率与平移偏移（屏幕像素）
function applyLbTransform(){
  var img=document.getElementById('lightboxImg');
  img.style.transform='translate('+lbTX+'px,'+lbTY+'px) scale('+lbScale+')';
  var sc=document.getElementById('lbScale'); if(sc) sc.textContent=Math.round(lbScale*100)+'%';
}
function lbReset(){ lbScale=1; lbTX=0; lbTY=0; applyLbTransform(); }
function lbSetScale(s){
  lbScale=clampScale(s, IMAGE_VIEWER_LIMITS.minScale, IMAGE_VIEWER_LIMITS.maxScale);
  if(lbScale<=1.001){ lbTX=0; lbTY=0; }   // 复位到 1x 时清除平移
  applyLbTransform();
}
function lbZoomBy(delta){ lbSetScale(nextImageScale(lbScale, delta, IMAGE_VIEWER_LIMITS.minScale, IMAGE_VIEWER_LIMITS.maxScale)); }
function openLightbox(src){ playSound('pop'); var lb=document.getElementById('lightbox'); document.getElementById('lightboxImg').src=src; lbReset(); lb.classList.add('show'); }
function closeLightbox(){ var lb=document.getElementById('lightbox'); lb.classList.remove('show'); document.getElementById('lightboxImg').src=''; lbReset(); }
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', function(e){ if(e.target===this || e.target.classList.contains('lightbox-hint')) closeLightbox(); });
document.getElementById('lbZoomIn').addEventListener('click', function(){ lbZoomBy(IMAGE_VIEWER_LIMITS.step); });
document.getElementById('lbZoomOut').addEventListener('click', function(){ lbZoomBy(-IMAGE_VIEWER_LIMITS.step); });
document.getElementById('lbReplace').addEventListener('click', function(){ if(lightboxType){ currentImgTarget=lightboxType+'Img'; document.getElementById('imgFile').click(); } closeLightbox(); });
document.getElementById('lbDel').addEventListener('click', function(){
  if(lightboxType && editing){
    editing.data.image_id=null; editing.data.image=null;
    var el=document.getElementById(lightboxType+'Img'); if(el){ el.style.backgroundImage=''; el.classList.remove('has-img'); el.textContent='点击插入图片'; }
    saveDB();
  }
  closeLightbox();
});
/* 滚轮缩放（桌面） */
var lbStage=document.getElementById('lightboxStage');
lbStage.addEventListener('wheel', function(e){ e.preventDefault(); lbZoomBy(e.deltaY<0 ? IMAGE_VIEWER_LIMITS.step/2 : -IMAGE_VIEWER_LIMITS.step/2); }, { passive:false });
/* 双击：在 1x 与 2x 之间切换 */
document.getElementById('lightboxImg').addEventListener('dblclick', function(){ lbSetScale(toggleImageScale(lbScale, IMAGE_VIEWER_LIMITS.minScale, IMAGE_VIEWER_LIMITS.maxScale, 2)); });
/* 触摸：双指捏合缩放 + 单指拖动平移（仅在已放大时） */
(function(){
  function dist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
  var pinch=null, pan=null;
  lbStage.addEventListener('touchstart', function(e){
    if(e.touches.length===2){ pinch={ d:dist(e.touches), scale:lbScale }; }
    else if(e.touches.length===1 && lbScale>1){ pan={ x:e.touches[0].clientX, y:e.touches[0].clientY, tx:lbTX, ty:lbTY }; }
  }, { passive:false });
  lbStage.addEventListener('touchmove', function(e){
    if(e.touches.length===2 && pinch){
      e.preventDefault();
      var d=dist(e.touches); if(d>0) lbSetScale(pinch.scale * (d/pinch.d));
    } else if(e.touches.length===1 && pan && lbScale>1){
      e.preventDefault();
      lbTX=pan.tx + (e.touches[0].clientX-pan.x);
      lbTY=pan.ty + (e.touches[0].clientY-pan.y);
      applyLbTransform();
    }
  }, { passive:false });
  lbStage.addEventListener('touchend', function(e){ if(e.touches.length<2) pinch=null; if(e.touches.length===0) pan=null; });
})();
/* custom important-day events */

// editor toolbar
var toolbarBtnMap=[null,'checklist','image',null,'link'];
document.querySelectorAll('#editortoolbar .etbtn').forEach(function(btn, i){

/* ============ INIT ============ */
/* 恢复上次选择的导出文件夹（句柄持久化在 IndexedDB） */
loadExportDirHandle().then(function(h){ if(h){ exportDirHandle=h; exportDirLabel=h.name||'所选文件夹'; } });
/* 先等 IndexedDB 数据载入再渲染，否则会先闪一帧内置示例数据 */
markBootStage('store-loading');
/* 存储层可能既不 resolve 也不 reject（权限被拒/库损坏/隐私模式），
   那样 .then/.catch 都不会执行，App 会永远停在空白页。加超时兜底，保证一定能打开。 */
raceTimeout(bootstrapStore(), BOOT_STORE_TIMEOUT, BOOT_TIMEOUT_SENTINEL).then(function(result){
  if(isBootTimeout(result)){
    if(window.__wmSaveCrash) window.__wmSaveCrash('promise', '存储载入超时（'+BOOT_STORE_TIMEOUT+'ms）', 'bootstrapStore 未在超时前完成，已降级到本地存储');
    STORAGE_MODE = 'ls';
    loadFromLocalStorage();
    storeBootAborted = true;   // 同步语句，不会被迟到的 IndexedDB 结果插入
  }
  loadSettings();
  renderHome(); renderCalendar(); renderStats();
  maybeAutoShowQuote();
  /* 启动时为所有已保存记录登记多级提醒（应用重启后 setTimeout 会清空，须重建） */
  armAllReminders();
  markBootOk();
  /* 系统层通知延后一拍：即便插件异常，也不能拖住首屏渲染 */
  setTimeout(function(){
    try { rescheduleAllNotifications(); } catch(e){ /* 通知失败不影响主功能 */ }
  }, 500);
}).catch(function(e){
  // 存储层异常不应让 App 白屏：用内存中的（示例/降级）数据继续启动
  loadSettings();
  renderHome(); renderCalendar(); renderStats();
  markBootOk();
  // App 已经起来了，但把异常留档，便于下次打开时排查
  if(window.__wmSaveCrash) window.__wmSaveCrash('promise', (e && e.message) || String(e), (e && e.stack) || '');
});
